<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What is todays target?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">

      <div class="header">
        <img class="logo" src="R.png" alt="R" />
        <h1 class="title">What is todays target&nbsp;?</h1>
      </div>

      <div class="top-row">
        <button id="add-task-toggle-btn" class="pill-btn" aria-expanded="false">
          + Add Task
        </button>
        <button id="test-notif-btn" class="pill-btn pill-btn-ghost" title="Send a test notification to verify they are working">
          Test Notify
        </button>
      </div>

      <div id="add-task-panel" class="add-task-panel" role="region" aria-label="Add task form">
        <form id="add-task-form" class="input-form">
          <div class="input-row">
            <input
              type="text"
              id="task-input"
              placeholder="e.g. Add Golu as friend at 7 PM"
              autocomplete="off"
              aria-label="Task description"
            />
          </div>
          <div class="input-row">
            <input
              type="text"
              id="task-url-input"
              placeholder="Trigger URL (optional), e.g. facebook.com"
              autocomplete="off"
              aria-label="Trigger URL"
            />
            <button type="submit" id="add-submit-btn" class="submit-btn">Add</button>
          </div>
          <div id="preview-chip" class="preview-chip hidden" aria-live="polite">
            <span class="preview-icon">&#9200;</span>
            <span id="preview-text"></span>
          </div>
        </form>
      </div>
 
      <div class="task-card">
        <div class="headers-row">
          <div class="header-task">
            <div class="header-pill">Task</div>
          </div>
          <div class="header-link">
            <div class="header-pill">Link</div>
          </div>
        </div>
 
        <div id="task-list" class="task-list" role="list" aria-label="Task list"></div>
 
        <div id="empty-state" class="empty-state hidden" role="status">
          <p>No tasks yet.<br/>Click &quot;+ Add Task&quot; to set your targets!</p>
        </div>
      </div>
 
      <div class="bottom-actions">
        <button id="remove-tasks-btn" class="pill-btn">Remove Done</button>
      </div>
 
    </div>
 
    <script src="timeParser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
